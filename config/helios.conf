# Project Helios central configuration

# Automatically detect the first normal user created during Debian installation
HELIOS_USER="$(awk -F: '$3 >= 1000 && $3 < 65534 {print $1; exit}' /etc/passwd)"
HELIOS_HOME="$(getent passwd "$HELIOS_USER" | cut -d: -f6)"

# Display settings
SCREEN_WIDTH="1920"
SCREEN_HEIGHT="1080"
SCREEN_REFRESH="60"

# Main project directories
HELIOS_CONFIG_DIR="$HELIOS_HOME/.config/helios"
HELIOS_ASSET_DIR="$HELIOS_HOME/.local/share/helios"

# Background image
HELIOS_BACKGROUND="$HELIOS_HOME/.local/share/helios/backgrounds/helios-background.png"

# Local mount point for network media
SMB_MOUNT_POINT="$HELIOS_HOME/Videos"

# SMB share details will be filled in later
SMB_SERVER=""
SMB_SHARE=""
SMB_USERNAME=""
SMB_DOMAIN=""

# Application launch behaviour
BRAVE_FULLSCREEN="true"
FREETUBE_FULLSCREEN="true"
PLEX_FULLSCREEN="true"
MOONLIGHT_FULLSCREEN="true"
SPOTIFY_MAXIMIZED="true"
MPV_FULLSCREEN="true"

# Application commands
CMD_MOONLIGHT="flatpak run com.moonlight_stream.Moonlight"
CMD_PLEX="flatpak run tv.plex.PlexHTPC"
CMD_FREETUBE="flatpak run io.freetubeapp.FreeTube"
CMD_SPOTIFY="flatpak run com.spotify.Client"
CMD_BRAVE="brave-browser --start-fullscreen"
CMD_FILES="pcmanfm $HELIOS_HOME/Videos"
CMD_MPV="mpv --fs"
CMD_TERMINAL="lxterminal"

# Launcher
CMD_LAUNCHER="flex-launcher"