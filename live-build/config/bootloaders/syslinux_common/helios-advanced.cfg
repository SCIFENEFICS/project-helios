label expert-gui
    menu label ^Expert graphical installation
    linux /install/gtk/vmlinuz
    initrd /install/gtk/initrd.gz
    append priority=low vga=788 @APPEND_INSTALL@

label expert-text
    menu label Expert ^text installation
    linux /install/vmlinuz
    initrd /install/initrd.gz
    append priority=low vga=788 @APPEND_INSTALL@

label rescue-gui
    menu label ^Rescue mode
    linux /install/gtk/vmlinuz
    initrd /install/gtk/initrd.gz
    append rescue/enable=true vga=788 @APPEND_INSTALL@ --- quiet

label live-amd64
    menu label ^Live system
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components quiet splash

label live-amd64-failsafe
    menu label Live system (^fail-safe)
    linux /live/vmlinuz
    initrd /live/initrd.img
    append boot=live components memtest noapic noapm nodma nomce nosmp nosplash vga=788

include utilities.cfg
