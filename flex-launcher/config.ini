[General]
DefaultMenu=Home
VSync=true
OnLaunch=Blank
WrapEntries=true
ResetOnBack=false
MouseSelect=true
InhibitOSScreensaver=true

[Background]
Mode=Color
Color=#101010
Overlay=false

[Layout]
MaxButtons=4
IconSize=170
IconSpacing=4%
VCenter=50%

[Titles]
Font=/usr/share/flex-launcher/assets/fonts/OpenSans-Regular.ttf
Enabled=true
FontSize=34
Color=#FFFFFF
Shadows=true
ShadowColor=#000000
Opacity=100%
OversizeMode=Shrink
Padding=18

[Highlight]
Enabled=true
FillColor=#FFFFFF
FillOpacity=20%
OutlineSize=3
OutlineColor=#FFFFFF
OutlineOpacity=90%
CornerRadius=12
VPadding=24
HPadding=24

[Scroll Indicators]
Enabled=true
FillColor=#FFFFFF
OutlineSize=0
Opacity=80%

[Clock]
Font=/usr/share/flex-launcher/assets/fonts/SourceSansPro-Regular.ttf
Enabled=true
ShowDate=true
Alignment=Right
FontSize=42
Margin=3%
FontColor=#FFFFFF
Shadows=true
ShadowColor=#000000
Opacity=90%
TimeFormat=Auto
DateFormat=Little
IncludeWeekday=true

[Screensaver]
Enabled=false

[Gamepad]
Enabled=true
DeviceIndex=-1


[Home]
Entry1=Plex;/usr/share/flex-launcher/assets/icons/plex.png;/home/helios/.local/share/applications/plex.desktop
Entry2=YouTube;/usr/share/flex-launcher/assets/icons/youtube.svg;/home/helios/.local/share/applications/youtube.desktop
Entry3=Spotify;/usr/share/flex-launcher/assets/icons/spotify.svg;/home/helios/.local/share/applications/spotify.desktop
Entry4=Moonlight;/usr/share/flex-launcher/assets/icons/moonlight.png;/home/helios/.local/share/applications/moonlight.desktop
Entry5=Brave;/usr/share/flex-launcher/assets/icons/brave.svg;/home/helios/.local/share/applications/brave.desktop
Entry7=Files;/usr/share/flex-launcher/assets/icons/files.svg;/home/helios/.local/share/applications/files.desktop
Entry8=Settings;/usr/share/flex-launcher/assets/icons/settings.svg;:submenu Settings

[Settings]
Entry1=Network;/usr/share/flex-launcher/assets/icons/network.svg;DISPLAY=:0 xterm -fullscreen -fa Monospace -fs 22 -e nmtui
Entry2=Display;/usr/share/flex-launcher/assets/icons/display.svg;echo "Display"
Entry3=Audio;/usr/share/flex-launcher/assets/icons/audio.svg;echo "Audio"
Entry5=Power;/usr/share/flex-launcher/assets/icons/power.svg;:submenu Power

[Power]
Entry1=Restart;/usr/share/flex-launcher/assets/icons/restart.png;:restart
Entry2=Shut Down;/usr/share/flex-launcher/assets/icons/system.png;:shutdown
