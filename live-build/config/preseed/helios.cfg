### Project Helios simple installer defaults

# Language, country and locale
d-i debian-installer/language string en
d-i debian-installer/country string AU
d-i debian-installer/locale string en_GB.UTF-8
d-i localechooser/supported-locales multiselect en_GB.UTF-8

# Standard Australian PC keyboard layout
d-i keyboard-configuration/xkb-keymap select us

# Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string Australia/Melbourne
d-i clock-setup/ntp boolean true

# Network configuration
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/get_hostname string helios
d-i netcfg/get_domain string


# Standard Helios account
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Helios
d-i passwd/username string helios
d-i passwd/user-password-crypted password $6$i5uymPqLg.g0NPEc$iIIA8oKKFg2dewza.QCF.N/7GDGqvV16v0Sb7.nphDaqX1R0EP8/9n1WHPxjvALVEMviFF86cSe3iozv1c4xz1

# Automatically use the whole selected disk with one main partition
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Install GRUB automatically to the default target disk
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

# Finish installation without another confirmation
d-i finish-install/reboot_in_progress note
