menu hshift 0

include stdmenu.cfg

label install-helios
    menu label        Install Helios
    menu default
    linux /install/gtk/vmlinuz
    initrd /install/gtk/initrd.gz
    append auto=true priority=high vga=788 @APPEND_INSTALL@ --- quiet

menu begin advanced
    menu label    Advanced Installation
    menu title Advanced Installation
    include stdmenu.cfg

    label mainmenu
        menu label ^Back
        menu exit

    include helios-advanced.cfg
menu end

menu clear
