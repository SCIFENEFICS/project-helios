[Settings]
DefaultMenu=Home
VSync=true
OnLaunch=Blank
WrapEntries=true
ResetOnBack=false
MouseSelect=true
InhibitOSScreensaver=true

[Background]
Mode=Color
Color=#101010
Overlay=false

[Layout]
MaxButtons=4
IconSize=220
IconSpacing=4%
VCenter=50%

[Titles]
Enabled=true
FontSize=34
Color=#FFFFFF
Shadows=true
ShadowColor=#000000
Opacity=100%
OversizeMode=Shrink
Padding=18

[Highlight]
Enabled=true
FillColor=#FFFFFF
FillOpacity=20%
OutlineSize=3
OutlineColor=#FFFFFF
OutlineOpacity=90%
CornerRadius=12
VPadding=24
HPadding=24

[Scroll Indicators]
Enabled=true
FillColor=#FFFFFF
OutlineSize=0
Opacity=80%

[Clock]
Enabled=true
ShowDate=true
Alignment=Right
FontSize=42
Margin=3%
FontColor=#FFFFFF
Shadows=true
ShadowColor=#000000
Opacity=90%
TimeFormat=Auto
DateFormat=Little
IncludeWeekday=true

[Screensaver]
Enabled=false

[Gamepad]
Enabled=true
DeviceIndex=-1

[Home]
Entry1=Moonlight;;/home/helios/.local/share/applications/moonlight.desktop
Entry2=Plex;;/home/helios/.local/share/applications/plex.desktop
Entry3=FreeTube;;/home/helios/.local/share/applications/freetube.desktop
Entry4=More;;:submenu More

[More]
Entry1=Brave;;/home/helios/.local/share/applications/brave.desktop
Entry2=Spotify;;/home/helios/.local/share/applications/spotify.desktop
Entry3=Files;;/home/helios/.local/share/applications/files.desktop
Entry4=System;;:submenu System

[System]
Entry1=MPV;;/home/helios/.local/share/applications/mpv.desktop
Entry2=Restart;;:restart
Entry3=Shut Down;;:shutdown
Entry4=Back;;:back
