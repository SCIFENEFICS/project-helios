[General]
DefaultMenu=Home
VSync=true
OnLaunch=Blank
WrapEntries=true
ResetOnBack=false
MouseSelect=true
InhibitOSScreensaver=true

[Background]
Mode=Image
Image=/usr/share/helios/backgrounds/helios-background.jpg
Overlay=false

[Layout]
MaxButtons=8
Rows=2
RowSpacing=40
IconSize=140
IconSpacing=6%
IconShadows=true
IconShadowColor=#000000
IconShadowOpacity=18%
IconShadowOffsetX=0
IconShadowOffsetY=0
IconShadowBlur=12
VCenter=50%

[Logo]
LogoEnabled=true
LogoImage=/usr/share/helios/icons/helios-white.svg
LogoAlignment=Left
LogoMargin=6
LogoWidth=110
LogoHeight=0
LogoOpacity=100%

[Titles]
Font=/usr/share/flex-launcher/assets/fonts/OpenSans-Regular.ttf
Enabled=true
FontSize=34
Color=#FFFFFF
Shadows=true
ShadowColor=#000000
Opacity=100%
OversizeMode=Shrink
Padding=18

[Highlight]
CornerRadius=25
Enabled=true
FillColor=#FFFFFF
FillOpacity=20%
OutlineSize=2
OutlineColor=#FFFFFF
OutlineOpacity=80%
VPadding=24
HPadding=24

[Scroll Indicators]
Enabled=true
FillColor=#FFFFFF
OutlineSize=2
Opacity=80%

[Clock]
Font=/usr/share/flex-launcher/assets/fonts/SourceSansPro-Regular.ttf
Enabled=true
ShowDate=true
Alignment=Right
FontSize=42
ClockDateFontSize=26
Margin=3%
FontColor=#FFFFFF
Shadows=true
ShadowColor=#000000
Opacity=90%
TimeFormat=Auto
DateFormat=Little
IncludeWeekday=true

[Screensaver]
Enabled=false

[Gamepad]
Enabled=true
DeviceIndex=-1
LStickX-=:left
LStickX+=:right
LStickY-=:up
LStickY+=:down
ButtonA=:select
ButtonB=:back
ButtonGuide=:home
ButtonDPadUp=:up
ButtonDPadDown=:down
ButtonDPadLeft=:left
ButtonDPadRight=:right

[Home]
Entry1=Plex;/usr/share/helios/icons/plex.png;/home/helios/.local/share/applications/plex.desktop
Entry2=YouTube;/usr/share/helios/icons/youtube.svg;/home/helios/.local/share/applications/youtube.desktop
Entry3=Spotify;/usr/share/helios/icons/spotify.svg;/home/helios/.local/share/applications/spotify.desktop
Entry4=Moonlight;/usr/share/helios/icons/moonlight.png;/home/helios/.local/share/applications/moonlight.desktop
Entry5=Brave;/usr/share/helios/icons/brave.svg;/home/helios/.local/share/applications/brave.desktop
Entry6=Files;/usr/share/helios/icons/files.svg;/home/helios/.local/share/applications/files.desktop
Entry7=Restart;/usr/share/helios/icons/restart.svg;:restart
Entry8=Shut Down;/usr/share/helios/icons/shutdown.svg;:shutdown
Entry9=Update Helios;/usr/share/helios/icons/update.svg;/home/helios/.local/share/applications/update-helios.desktop
